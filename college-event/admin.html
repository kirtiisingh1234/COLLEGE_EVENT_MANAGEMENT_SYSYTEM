<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - CampusEvents</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f7, #ffe4f0);
            color: #4a1734;
            min-height: 100vh;
        }

        nav {
            height: 75px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 4px 20px rgba(190, 24, 93, 0.12);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #be185d;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #5f4051;
            font-weight: 600;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #db2777;
        }

        #logoutBtn {
            border: none;
            background: #db2777;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #logoutBtn:hover {
            background: #be185d;
        }

        .header {
            text-align: center;
            padding: 60px 20px 35px;
        }

        .header span {
            color: #db2777;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .header h1 {
            font-size: 45px;
            margin: 14px 0;
        }

        .header p {
            color: #76576b;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        .admin-card {
            background: white;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(190, 24, 93, 0.10);
            margin-bottom: 30px;
        }

        .admin-card h2 {
            color: #be185d;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-box label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .input-box input,
        .input-box select {
            padding: 13px;
            border: 1px solid #f9a8d4;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        .input-box input:focus,
        .input-box select:focus {
            border-color: #db2777;
        }

        .full {
            grid-column: 1 / -1;
        }

        .add-btn {
            margin-top: 22px;
            border: none;
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
            padding: 14px 25px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn:hover {
            transform: translateY(-2px);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .event-card {
            background: #fff7fb;
            border: 1px solid #fbcfe8;
            padding: 22px;
            border-radius: 18px;
        }

        .event-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .event-card h3 {
            margin-bottom: 12px;
        }

        .event-card p {
            color: #76576b;
            font-size: 13px;
            line-height: 1.8;
        }

        .delete-btn {
            margin-top: 15px;
            width: 100%;
            border: none;
            background: #ffe4e6;
            color: #be123c;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #fecdd3;
        }

        .student-card {
            background: #fff7fb;
            border: 1px solid #fbcfe8;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .student-event {
            color: #be185d;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .student-info {
            color: #76576b;
            font-size: 14px;
            line-height: 2;
        }

        .registered-badge {
            display: inline-block;
            background: #dcfce7;
            color: #15803d;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 10px;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 30px;
            color: #76576b;
        }

        .loading {
            color: #be185d;
            font-weight: bold;
        }

        footer {
            margin-top: 70px;
            background: #4a1734;
            color: white;
            text-align: center;
            padding: 30px;
        }

        footer p {
            margin-top: 8px;
            opacity: 0.7;
            font-size: 13px;
        }

        @media(max-width: 850px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .events-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width: 600px) {
            nav {
                height: auto;
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .header h1 {
                font-size: 35px;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            🎓 CampusEvents
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="my-events.html">
                My Events
            </a>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </nav>


    <!-- HEADER -->

    <section class="header">

        <span>
            ADMINISTRATION
        </span>

        <h1>
            Admin Panel ⚙️
        </h1>

        <p>
            Manage college events and registrations.
        </p>

    </section>


    <div class="container">


        <!-- ADD EVENT -->

        <div class="admin-card">

            <h2>
                ➕ Add New Event
            </h2>

            <div class="form-grid">

                <div class="input-box">

                    <label>
                        Event Name
                    </label>

                    <input
                        type="text"
                        id="eventName"
                        placeholder="Enter event name"
                    >

                </div>


                <div class="input-box">

                    <label>
                        Category
                    </label>

                    <select id="eventCategory">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Cultural">
                            Cultural
                        </option>

                        <option value="Technical">
                            Technical
                        </option>

                        <option value="Sports">
                            Sports
                        </option>

                        <option value="Technology">
                            Technology
                        </option>

                        <option value="Exhibition">
                            Exhibition
                        </option>

                    </select>

                </div>


                <div class="input-box">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        id="eventDate"
                    >

                </div>


                <div class="input-box">

                    <label>
                        Time
                    </label>

                    <input
                        type="time"
                        id="eventTime"
                    >

                </div>


                <div class="input-box full">

                    <label>
                        Venue
                    </label>

                    <input
                        type="text"
                        id="eventVenue"
                        placeholder="College Auditorium"
                    >

                </div>


                <div class="input-box full">

                    <label>
                        Description
                    </label>

                    <input
                        type="text"
                        id="eventDescription"
                        placeholder="Enter event description"
                    >

                </div>

            </div>


            <button
                class="add-btn"
                id="addEventBtn"
            >
                ➕ Add Event
            </button>

        </div>


        <!-- ALL EVENTS -->

        <div class="admin-card">

            <h2>
                📋 All Events
            </h2>

            <div
                id="eventsContainer"
                class="events-grid"
            >

                <div class="loading">
                    Loading events...
                </div>

            </div>

        </div>


        <!-- REGISTERED STUDENTS -->

        <div class="admin-card">

            <h2>
                👥 Registered Students
            </h2>

            <div id="studentsContainer">

                <div class="loading">
                    Loading registered students...
                </div>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        <h3>
            🎓 CampusEvents
        </h3>

        <p>
            College Event Management System
        </p>

        <p>
            © 2026 CampusEvents
        </p>

    </footer>


    <!-- FIREBASE -->

    <script type="module">

        import {
            db,
            auth
        } from "./firebase.js";


        import {
            collection,
            addDoc,
            getDocs,
            deleteDoc,
            doc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        import {
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        const eventsContainer =
            document.getElementById("eventsContainer");


        const studentsContainer =
            document.getElementById("studentsContainer");


        const addEventBtn =
            document.getElementById("addEventBtn");


        const logoutBtn =
            document.getElementById("logoutBtn");


        /* ================= LOGOUT ================= */

        logoutBtn.addEventListener(
            "click",
            async function () {

                try {

                    await signOut(auth);

                    alert(
                        "✅ Logged out successfully!"
                    );

                    window.location.href =
                        "adminlogin.html";

                }

                catch (error) {

                    console.error(error);

                    alert(
                        "❌ Logout failed!\n\n" +
                        error.message
                    );

                }

            }
        );


        /* ================= ICON ================= */

        function getIcon(category) {

            if (category === "Cultural") {
                return "🎭";
            }

            if (category === "Technical") {
                return "💻";
            }

            if (category === "Sports") {
                return "🏆";
            }

            if (category === "Technology") {
                return "🤖";
            }

            if (category === "Exhibition") {
                return "🎨";
            }

            return "🎉";
        }


        /* ================= ADD EVENT ================= */

        addEventBtn.addEventListener(
            "click",
            async function () {

                const name =
                    document
                    .getElementById("eventName")
                    .value
                    .trim();


                const category =
                    document
                    .getElementById("eventCategory")
                    .value;


                const date =
                    document
                    .getElementById("eventDate")
                    .value;


                const time =
                    document
                    .getElementById("eventTime")
                    .value;


                const venue =
                    document
                    .getElementById("eventVenue")
                    .value
                    .trim();


                const description =
                    document
                    .getElementById("eventDescription")
                    .value
                    .trim();


                if (
                    !name ||
                    !category ||
                    !date ||
                    !time ||
                    !venue
                ) {

                    alert(
                        "⚠️ Please fill all required fields."
                    );

                    return;

                }


                try {

                    await addDoc(
                        collection(
                            db,
                            "events"
                        ),
                        {

                            eventName:
                                name,

                            eventCategory:
                                category,

                            eventDate:
                                date,

                            eventTime:
                                time,

                            eventVenue:
                                venue,

                            eventDescription:
                                description,

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    alert(
                        "🎉 Event Added Successfully!"
                    );


                    document
                        .getElementById("eventName")
                        .value = "";


                    document
                        .getElementById("eventCategory")
                        .value = "";


                    document
                        .getElementById("eventDate")
                        .value = "";


                    document
                        .getElementById("eventTime")
                        .value = "";


                    document
                        .getElementById("eventVenue")
                        .value = "";


                    document
                        .getElementById("eventDescription")
                        .value = "";


                    loadEvents();

                }

                catch (error) {

                    console.error(error);

                    alert(
                        "❌ Failed to add event.\n\n" +
                        error.message
                    );

                }

            }
        );


        /* ================= LOAD EVENTS ================= */

        async function loadEvents() {

            eventsContainer.innerHTML = `

                <div class="loading">
                    Loading events...
                </div>

            `;


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "events"
                        )
                    );


                eventsContainer.innerHTML = "";


                if (snapshot.empty) {

                    eventsContainer.innerHTML = `

                        <div class="empty">
                            No events found.
                        </div>

                    `;

                    return;

                }


                snapshot.forEach(
                    function (eventDoc) {

                        const event =
                            eventDoc.data();


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "event-card";


                        card.innerHTML = `

                            <div class="event-icon">
                                ${getIcon(event.eventCategory)}
                            </div>

                            <h3>
                                ${event.eventName}
                            </h3>

                            <p>

                                🏷️
                                ${event.eventCategory}

                                <br>

                                📅
                                ${event.eventDate}

                                <br>

                                🕐
                                ${event.eventTime}

                                <br>

                                📍
                                ${event.eventVenue}

                                <br>

                                📝
                                ${
                                    event.eventDescription
                                    ||
                                    "No description"
                                }

                            </p>


                            <button
                                class="delete-btn"
                                data-id="${eventDoc.id}"
                            >
                                🗑️ Delete Event
                            </button>

                        `;


                        const deleteButton =
                            card.querySelector(
                                ".delete-btn"
                            );


                        deleteButton.addEventListener(
                            "click",
                            function () {

                                deleteEvent(
                                    eventDoc.id
                                );

                            }
                        );


                        eventsContainer.appendChild(
                            card
                        );

                    }
                );

            }

            catch (error) {

                console.error(error);

                eventsContainer.innerHTML = `

                    <div class="empty">

                        ❌
                        ${error.message}

                    </div>

                `;

            }

        }


        /* ================= DELETE EVENT ================= */

        async function deleteEvent(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this event?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                await deleteDoc(
                    doc(
                        db,
                        "events",
                        id
                    )
                );


                alert(
                    "🗑️ Event Deleted!"
                );


                loadEvents();

            }

            catch (error) {

                console.error(error);

                alert(
                    "❌ Delete failed.\n\n" +
                    error.message
                );

            }

        }


        /* ================= LOAD REGISTERED STUDENTS ================= */

        async function loadStudents() {

            studentsContainer.innerHTML = `

                <div class="loading">
                    Loading registered students...
                </div>

            `;


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "eventRegistrations"
                        )
                    );


                studentsContainer.innerHTML = "";


                if (snapshot.empty) {

                    studentsContainer.innerHTML = `

                        <div class="empty">

                            👥

                            <br><br>

                            No students have registered
                            for any event yet.

                        </div>

                    `;

                    return;

                }


                snapshot.forEach(
                    function (studentDoc) {

                        const student =
                            studentDoc.data();


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "student-card";


                        card.innerHTML = `

                            <div class="student-event">

                                🎟️
                                ${
                                    student.eventName
                                    ||
                                    "Event"
                                }

                            </div>


                            <div class="student-info">

                                👤
                                <strong>
                                    Student ID:
                                </strong>

                                ${
                                    student.userId
                                    ||
                                    "N/A"
                                }

                                <br>


                                📧
                                <strong>
                                    Email:
                                </strong>

                                ${
                                    student.email
                                    ||
                                    "N/A"
                                }

                                <br>


                                📅
                                <strong>
                                    Event Date:
                                </strong>

                                ${
                                    student.eventDate
                                    ||
                                    "N/A"
                                }

                                <br>


                                📍
                                <strong>
                                    Venue:
                                </strong>

                                ${
                                    student.eventVenue
                                    ||
                                    "N/A"
                                }

                                <br>


                                🏷️
                                <strong>
                                    Category:
                                </strong>

                                ${
                                    student.eventCategory
                                    ||
                                    "N/A"
                                }

                            </div>


                            <span class="registered-badge">

                                ✓ REGISTERED

                            </span>

                        `;


                        studentsContainer.appendChild(
                            card
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    "Registered Students Error:",
                    error
                );


                studentsContainer.innerHTML = `

                    <div class="empty">

                        ❌
                        Unable to load students.

                        <br><br>

                        ${error.message}

                    </div>

                `;

            }

        }


        /* ================= START ================= */

        loadEvents();

        loadStudents();

    </script>


<script>
/* Connected-app navigation helper: all pages return to the project home. */
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('a[href="../index.html"]').forEach(a => a.setAttribute('href','index.html'));
  document.querySelectorAll('a[href="admin-login.html"]').forEach(a => a.setAttribute('href','adminlogin.html'));
});
</script>

</body>

</html>
